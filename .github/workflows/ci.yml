name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check published alias table is up to date
        run: python3 tools/data/export_aliases.py --check

      - name: Check prebuilt static database is up to date
        run: python3 tools/data/build_static_db.py --check

      - name: Check achievements match Achievement.kt
        run: python3 generate_achievements_zip.py --check

      - uses: gradle/actions/setup-gradle@v4

      # verifyRoborazziDebug runs the whole testDebugUnitTest task (every JVM unit test) with
      # screenshot comparison switched on, so testDebugUnitTest is not listed separately.
      - name: Build, unit test (with screenshot verification) and lint
        run: ./gradlew assembleDebug verifyRoborazziDebug lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore
